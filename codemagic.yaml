workflows:
  beta_distribution:
    name: Beta Build and Distribution
    environment:
      groups:
        - tokens  # This group now includes BASE64_FIREBASE_KEY and your secure variables
    scripts:
      - name: Decode Firebase Service Account Key
        script: |
          echo "$BASE64_FIREBASE_KEY" | base64 --decode > firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/firebase-service-account.json"
      - name: Clean and Build Debug APK
        script: |
          ./gradlew clean assembleDebug
      - name: Run Tests
        script: |
          ./gradlew testDebug
      - name: Build APK (Beta)
        script: |
          ./gradlew assembleDebug
      - name: Distribute via Firebase App Distribution
        script: |
          npm install -g firebase-tools --force
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app $FIREBASE_APP_ID \
            --testers "kengyap@upm.edu.my" \
            --release-notes "Automated debug build from Codemagic"
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
    publishing:
      scripts:
        - echo "Beta debug build and distribution completed successfully."
